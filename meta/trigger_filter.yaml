# 触发过滤规则库（独立维护：增减关键词/意图仅修改本文件，无需改动主流程）
# 加载逻辑：命中任意 positive_trigger 且未命中 negative_trigger 时启用 Skill

# 正向触发：命中任意关键词/意图即加载Skill
positive_trigger:
  keyword:
    - 论文润色
    - 学位论文修改
    - 期刊段落优化
    - 学术文本改写
    - 试验描述规范
    - 结果分析润色
    - 引言逻辑优化
    - 章节预告语病
    - 术语统一
    - 数据表述规范
    - 论文修改
    - 学术表达优化
    - 论文语句优化
    - RMSE、相关系数、风洞、CFD、工况、标定、反演
  intent:
    - 优化语句逻辑、修正语序杂糅
    - 统一专业术语与符号
    - 精简冗余学术套话
    - 规范试验数据表述

# 反向排除：命中任意直接拦截，不启用本Skill
negative_trigger:
  keyword:
    - 代写论文
    - 论文降重
    - 编实验数据
    - 写小说
    - 中小学作文
    - 广告文案
    - 纯英文翻译
  intent:
    - 完整生成整篇论文
    - 虚构试验结论
    - 日常闲聊、情感咨询

# 判定优先级说明：negative_trigger 优先级高于 positive_trigger，
# 两者同时命中时按反向排除处理，终止 Skill 执行。
